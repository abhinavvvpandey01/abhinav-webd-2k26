<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <h1><b>HOTEL BOOKING ROOM</b></h1>
    <form action="#" method="post">
        <label for="FULL NAME">Name:</label>
        <input type="text" id="FULL NAME" name="FULL NAME"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>
        <label for="CHECK IN DATE">Check-in Date:</label>
        <input type="date" id="CHECK IN DATE" name="CHECK IN DATE"><br><br>
        <label for="CHECK OUT DATE">Check-out Date:</label>
        <input type="date" id="CHECK OUT DATE" name="CHECK OUT DATE"><br><br>
        <select name="ROOM TYPE" id="ROOM TYPE">
            <option value="single">Single Room</option>
            <option value="double">Double Room</option>
            <option value="suite">Suite</option>
            <option value="deluxe">Deluxe Room</option>
            <option value="penthouse">Penthouse</option>
        </select><br><br>
        <label for="GUESTS">Number of guests</label><br>
        <input type="number" id="GUESTS" name="GUESTS" min="1"><br><br>
        <label for="special-requests">Special Requests:</label><br>
        <textarea id="special-requests" name="special-requests" rows="4" cols="50" placeholder="Enter any special requests here..."></textarea><br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
